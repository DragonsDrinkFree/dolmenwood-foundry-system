<nav class="tabs" data-group="primary">
	{{#each tabs.primary}}
	<a class="item {{cssClass}}" data-tab="{{id}}" data-group="primary">
		<i class="{{icon}}"></i>
		<span>{{label}}</span>
	</a>
	{{/each}}
	{{#if @root.isGM}}<i class="fas {{#if @root.actor.prototypeToken.actorLink}}fa-link{{else}}fa-link-slash{{/if}} actor-link-icon" title="{{#if @root.actor.prototypeToken.actorLink}}{{localize 'DOLMEN.TokenLinked'}}{{else}}{{localize 'DOLMEN.TokenUnlinked'}}{{/if}}"></i>{{/if}}
</nav>
